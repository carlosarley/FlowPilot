# Mantener dependencias al dia: PRs semanales agrupados y alertas de seguridad.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Los saltos de version mayor pueden romper la web: se hacen a mano.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      acciones:
        patterns: ["*"]
